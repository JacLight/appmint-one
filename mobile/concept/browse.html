    </div>
    <div class="fgroup">
      <h4>Price / hour</h4>
      <div class="range"><input placeholder="$ min"><input placeholder="$ max"></div>
    </div>
    <div class="fgroup">
      <h4>Amenities</h4>
      <label class="fitem"><input type="checkbox">Indoors / covered</label>
      <label class="fitem"><input type="checkbox">24/7 access</label>
      <label class="fitem"><input type="checkbox">CCTV / secure room</label>
      <label class="fitem"><input type="checkbox">Late pickup</label>
      <label class="fitem"><input type="checkbox">At event venue</label>
    </div>
    <div class="fgroup">
      <h4>Rating</h4>
      <label class="fitem"><input type="checkbox">4.5★ &amp; up</label>
      <label class="fitem"><input type="checkbox">4.8★ &amp; up</label>
    </div>
  </aside>

  <!-- RESULTS -->

        <button class="maptoggle">🗺️ Map</button>
      </div>
    </div>

  </div>
</div>
